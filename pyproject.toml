[project]
name = "eyereader"
version = "0.1.0"
description = "눈동자 추적으로 읽는 위치를 표시하고 자동으로 페이지를 넘기는 책 리더"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pypdf",
    "ebooklib",
    "beautifulsoup4",
    "numpy",
    "requests",
    "opencv-python",
    "mediapipe",
    "pygame",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
eyereader = "eyereader.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["eyereader*"]
